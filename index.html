<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>에고이즘 리더 교육 설문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f4ef; --fg:#1b1a18; --muted:#6b675f; --card:#ffffff; --line:#e4dfd6; --line2:#cfc8bb;
  --acc:#ED6D20; --acc2:#ff8a3d; --accbg:#fff1e8; --ok:#1f8a4c; --okbg:#e7f6ec; --warn:#b26b00; --warnbg:#fff4df; --bad:#c0392b; --badbg:#fdecea;
  --blue:#2457a8; --bluebg:#e9f0fb; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -16px rgba(0,0,0,.25);
  --r:14px; --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f0f10; --fg:#f1efe9; --muted:#9b978e; --card:#191919; --line:#2b2a27; --line2:#3b3935;
  --accbg:#3a2415; --ok:#5fcf8b; --okbg:#143422; --warn:#f0b35a; --warnbg:#3a2a10; --bad:#ff7b6b; --badbg:#3d1a16;
  --blue:#8fb4ff; --bluebg:#172743; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0f0f10; --fg:#f1efe9; --muted:#9b978e; --card:#191919; --line:#2b2a27; --line2:#3b3935;
  --accbg:#3a2415; --ok:#5fcf8b; --okbg:#143422; --warn:#f0b35a; --warnbg:#3a2a10; --bad:#ff7b6b; --badbg:#3d1a16;
  --blue:#8fb4ff; --bluebg:#172743; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--acc)}
.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.top nav a{padding:6px 10px;border-radius:8px;color:var(--muted);font-size:14px}
.top nav a.on,.top nav a:hover{color:var(--fg);background:var(--card);text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 80px}
.narrow{max-width:760px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700}
h1{font-size:28px;line-height:1.25;margin:6px 0 10px;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 4px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:0 0 14px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c2{grid-template-columns:repeat(2,1fr)}
@media (max-width:720px){.grid.c3,.grid.c2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-weight:600;line-height:1.2;transition:.12s}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#d85f17}
.btn.ghost{background:transparent}
.btn.xs{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.sm{padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line2))}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.acc{background:var(--accbg);color:var(--acc)}
.badge.blue{background:var(--bluebg);color:var(--blue)}
.badge.gray{background:var(--bg);color:var(--muted);border-color:var(--line)}
.notice{border-left:4px solid var(--acc);background:var(--accbg);padding:10px 14px;border-radius:8px;margin:0 0 14px;font-size:14px}
.notice.blue{border-color:var(--blue);background:var(--bluebg)}
.notice.bad{border-color:var(--bad);background:var(--badbg)}
.notice.ok{border-color:var(--ok);background:var(--okbg)}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:600}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);outline:none}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
/* 드롭다운: 가로로 꽉 채우지 않고 화살표를 글자 가까이에 둔다 */
select.inp{appearance:none;-webkit-appearance:none;width:auto;min-width:260px;max-width:100%;padding:10px 44px 10px 14px;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%239b978e' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
select.inp:hover{border-color:var(--fg)}
.field{margin:0 0 12px}
/* survey */
.progress{position:sticky;top:53px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 16px;box-shadow:var(--shadow)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 8px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.parts{display:flex;gap:6px;flex-wrap:wrap}
.parts a{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.parts a.done{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.sec{margin:26px 0 10px}
.sec .eyebrow{margin-bottom:2px}
.sec p.note{color:var(--muted);font-size:14px;margin:4px 0 0}
.hd{margin:22px 0 8px;padding:0 0 6px;border-bottom:2px solid var(--line)}
.hd h3{font-size:17px}
.hd .note{font-size:13px;color:var(--muted);margin:2px 0 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 10px;scroll-margin-top:140px}
.q.err{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
.q .lab{font-weight:700;margin:0 0 14px;display:flex;gap:8px;align-items:flex-start}
.q .lab .no{color:var(--muted);font-weight:600;font-size:13px;flex:none;padding-top:3px;font-variant-numeric:tabular-nums}
.q .lab .req{color:var(--acc);font-size:12px;flex:none;padding-top:4px}
.q .desc{color:var(--muted);font-size:14px;margin:-8px 0 16px;line-height:1.5}
.q .errmsg{color:var(--bad);font-size:13px;margin:8px 0 0;display:none}
.q.err .errmsg{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.col{flex-direction:column;align-items:stretch}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);cursor:pointer;font-size:15px;text-align:left;line-height:1.3}
.chips.col .chip{border-radius:10px}
.chip:hover{border-color:var(--fg)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip.off{opacity:.45}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{padding:10px 6px;border:0;background:var(--bg);cursor:pointer;font-size:15px;border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#fff;font-weight:700}
.seg.sm button{padding:7px 4px;font-size:13px}
.seg.seg4{grid-template-columns:repeat(4,1fr)}
.seg button.na{color:var(--muted);font-size:13px}
.seg button.na.on{background:var(--line2);color:var(--fg)}
.acts{display:flex;flex-direction:column;gap:14px}
.act .aq{display:flex;gap:8px;font-size:14.5px;line-height:1.5;margin:0 0 8px}
.act .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.act .ctl .seg{flex:1 1 100%}
.nachip{padding:6px 10px;font-size:13px;color:var(--muted);border-radius:8px}
.nachip.on{background:var(--line2);border-color:var(--line2);color:var(--fg);font-weight:600}
/* 넓은 화면: 답변 버튼을 오른쪽 고정 폭 열에 두어 모든 행의 세 버튼이 일직선으로 정렬됨. "해당 없음"은 그 오른쪽 별도 칸. 좁은 화면은 질문 아래로 */
@media (min-width:721px){
  .acts{gap:10px}
  .act{display:grid;grid-template-columns:1fr 388px;gap:16px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
  .act:first-child{border-top:0;padding-top:0}
  .act .aq{margin:0}
  .act .ctl{display:grid;grid-template-columns:300px 80px;gap:8px;justify-content:start}
  .act .ctl .seg{width:300px}
  .act .seg button{padding:8px 4px;font-size:14px}
  .nachip{width:80px;padding:8px 0;text-align:center}
}
.an{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accbg);color:var(--acc);font-size:12px;font-weight:800;flex:none;margin-top:2px}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.cmp tr.grp td{background:var(--bg);font-size:13.5px;padding:8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{padding:11px 0;border-radius:10px;border:1px solid var(--line2);background:var(--bg);cursor:pointer;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.scale button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.scale.sm button{padding:6px 0;font-size:13px}
/* 5단계 글자 버튼 (전혀 그렇지 않다 … 매우 그렇다) — 값은 1~5로 저장 */
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale5 button{padding:10px 4px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);cursor:pointer;font-weight:600;font-size:13.5px;line-height:1.3;word-break:keep-all}
.scale5 button.on{background:var(--acc);border-color:var(--acc);color:#fff}
@media (max-width:600px){.scale5{gap:4px}.scale5 button{font-size:12px;padding:8px 2px}}
.seg.seg5{grid-template-columns:repeat(5,1fr)}
.seg.seg5 button{font-size:12px;padding:7px 2px;line-height:1.25;word-break:keep-all}
.ends{display:flex;justify-content:flex-end;font-size:12px;color:var(--muted);margin:6px 2px 0}
/* 문항 오른쪽 메모 (직후·4주 후 설문에서 본인의 이전 응답) */
.q.withmemo{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.memo{background:var(--bluebg);border:1px dashed var(--blue);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.memo .t{font-weight:700;color:var(--blue);font-size:12px;margin:0 0 4px}
.memo .v{white-space:pre-wrap}
@media (max-width:720px){.q.withmemo{grid-template-columns:1fr;gap:12px}.q.withmemo .memo{order:-1}}
.ctx{background:var(--bluebg);border:1px dashed var(--blue);border-radius:12px;padding:12px 14px;margin:0 0 10px;font-size:14px}
.ctx .t{font-weight:700;color:var(--blue);margin:0 0 4px;font-size:13px}
.ctx .v{white-space:pre-wrap}
.submitbar{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);padding:12px 0;margin-top:20px;border-top:1px solid var(--line)}
/* 대표님 대조 평가: 저장되지 않은 변경이 있을 때 화면 아래에 고정되는 저장 바 */
.savebar{position:sticky;bottom:12px;z-index:15;display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--warnbg);border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line));border-radius:12px;padding:10px 14px;margin:0 0 14px;box-shadow:var(--shadow)}
.savebar b{color:var(--warn)}
/* tables */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th,.tb td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tb th{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em;white-space:nowrap}
.tb tr.click{cursor:pointer}
.tb tr.click:hover td{background:var(--bg)}
.tb tr.sel td{background:var(--accbg)}
.tb td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbwrap{overflow-x:auto}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow:visible}
.tabs button{padding:10px 14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--acc)}
.split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}.split .left.hide{display:none}}
.leaderlist{display:flex;flex-direction:column;gap:6px}
.leaderlist button{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:left}
.leaderlist button.on{border-color:var(--acc);background:var(--accbg)}
.leaderlist .nm{font-weight:700}
.leaderlist .tm{color:var(--muted);font-size:13px}
.leaderlist .st{margin-left:auto;display:flex;gap:3px}
.dotst{width:9px;height:9px;border-radius:50%;background:var(--line2);display:inline-block}
.dotst.on{background:var(--ok)}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{font-size:12px;color:var(--muted);text-align:left;white-space:nowrap}
.cmp td.it{min-width:180px}
.cmp td.it .d{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.45}
.cmp td.ctl{min-width:180px}
.cmp td.lv{white-space:nowrap;text-align:center;min-width:92px}
.cmp td.df{white-space:nowrap;text-align:center;min-width:80px}
.hidden-val{display:inline-block;background:var(--line);color:transparent;border-radius:6px;padding:2px 10px;user-select:none;letter-spacing:.2em}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.stat{grid-template-columns:repeat(2,1fr)}}
.stat .s{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .s .k{font-size:12px;color:var(--muted);font-weight:700}
.stat .s .v{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .s .v small{font-size:13px;font-weight:600;color:var(--muted)}
.ans{margin:0 0 14px}
.ans .k{font-size:12.5px;color:var(--muted);font-weight:700;margin:0 0 2px}
.ans .v{white-space:pre-wrap}
.ans .v.empty{color:var(--muted);font-style:italic}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv .k{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.demo{position:fixed;left:12px;bottom:12px;z-index:40;background:#111;color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;opacity:.85}
.demo b{color:var(--acc2)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.hero{padding:30px 0 10px}
.hero h1{font-size:32px}
@media (max-width:600px){.hero h1{font-size:26px}h1{font-size:24px}.cmp td.it{min-width:140px}.top .in{padding:8px 12px;gap:8px}.brand span:last-child{font-size:14px;white-space:nowrap}.top nav{gap:2px}.top nav a{padding:5px 7px;font-size:13px}}
.foot{max-width:960px;margin:0 auto;padding:10px 16px 40px;color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
.foot a{color:var(--muted)}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px}
.legend{font-size:12.5px;color:var(--muted)}
.legend b{color:var(--fg)}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="#/"><span class="dot"></span><span>에고이즘 리더 교육 설문</span></a>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="app"><div class="center" style="padding:60px 0"><span class="spin"></span></div></main>
<footer class="foot"><span>EGOIDSM · HR</span><a href="#/ceo">대표님 페이지</a><a href="#/admin">HR 관리</a><a href="#" id="themeBtn">테마</a></footer>
<div class="toast" id="toast"></div>
<script>
/* ================================================================
 * 설정 — 배포 시 build.py 가 API_URL 에 Apps Script 웹 앱 URL 을 넣는다.
 * API_URL 이 비어 있거나 주소에 ?demo=1 이 있으면 데모 모드(브라우저 localStorage)로 동작.
 * ================================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwtyAAg64vKqlksn-FEY8FtSMWWe7v4EDBfGJOfE0ojVHCrdvo4DJJvCeAHGpVGlMn9Yw/exec',
  DEADLINE: { pre: '10월 12일(월) 12:00', post: '10월 16일(금) 18:00', follow: '11월 16일(월) 18:00' },
  TRAINING_DATE: '10월 15일(목)'
};
const DEMO = false;

/* ───────────── 리더상 데이터 (설문 문서와 동일) ───────────── */
const MUST4 = [
  { n: 1, label: '중력', desc: '팀원들이 나와 함께 일하고 싶어 하고, 사람들이 내 주변으로 모인다' },

/* ───────────── 메타인지(자가진단 vs 대표 평가) 계산 ───────────── */
// 5점 척도는 범위 4, 3단계는 범위 2. 일치도 = 평균(1 - |차이|/범위) × 100
function diffClass(d, range) { if (d === 0) return 'match'; if (Math.abs(d) === 1 && range === 4) return 'near'; return d > 0 ? 'over' : 'under'; }
function compareRound(round, resp, ev) {
  // resp: 리더 응답 answers, ev: 대표 ratings.
  // 사전·4주 후 라운드 모두 같은 키: 필수 조건 q2_1_n (1–5) + 행동 질문 q2_2_n_k (아니다 1 · 일부만 2 · 그렇다 3) + 우대 조건 q2_3_1/2
  // 대표 평가 키는 e2_1_n / e2_2_n_k / strengths / weaknesses. "해당 없음"은 비교에서 제외.
  const rows = [], items = []; let sum = 0, n = 0;
  {
    MUST4.forEach(m => {
      const a = Number(resp && resp['q2_1_' + m.n]) || 0, c = Number(ev && ev['e2_1_' + m.n]) || 0;
      const row = { key: 'q2_1_' + m.n, ekey: 'e2_1_' + m.n, label: m.label, type: 'scale5', self: a, ceo: c, range: 4 };
      if (a && c) { row.diff = a - c; row.cls = diffClass(row.diff, 4); sum += 1 - Math.abs(row.diff) / 4; n++; }
      rows.push(row);
    });
  }
  ITEMS.forEach(it => {
    const itemRows = [];
    it.acts.forEach((act, k) => {
      const sk = 'q2_2_' + it.n + '_' + (k + 1), ek = 'e2_2_' + it.n + '_' + (k + 1);
      const st = resp && resp[sk] || '', ct = ev && ev[ek] || '';
      const a = actNum(act, st), c = actNum(act, ct);
      const row = { key: sk, ekey: ek, item: it.n, k, label: it.label + ' ' + (k + 1) + ')', q: act.q, opts: act.opts, type: 'exec3', self: a, ceo: c, selfText: st, ceoText: ct, range: 2, na: act.na };
      if (a && c) { row.diff = a - c; row.cls = diffClass(row.diff, 2); sum += 1 - Math.abs(row.diff) / 2; n++; }
      rows.push(row); itemRows.push(row);
    });
    const selfAvg = avgOf(itemRows.map(r => r.self).filter(Boolean)), ceoAvg = avgOf(itemRows.map(r => r.ceo).filter(Boolean));
    items.push({ n: it.n, label: it.label, selfAvg, ceoAvg, diff: selfAvg != null && ceoAvg != null ? selfAvg - ceoAvg : null });
  });
  const cnt = { match: 0, near: 0, over: 0, under: 0 };
  rows.forEach(r => { if (r.cls) cnt[r.cls]++; });
  const score = n ? Math.round(sum / n * 100) : null;
  const big = rows.filter(r => r.cls && r.cls !== 'match' && r.cls !== 'near').sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff)).slice(0, 3);
  let strengthOverlap = null, weakOverlap = null, hardOverlap = null;
  if (resp && ev) {
    const inter = (a, b) => (a || []).filter(x => (b || []).includes(x));
    if (ev.strengths && ev.strengths.length) strengthOverlap = inter(resp.q2_3_1, ev.strengths);
    if (ev.weaknesses && ev.weaknesses.length) weakOverlap = inter(resp.q2_3_2, ev.weaknesses);
  }
  if (resp && ev) {
    const hardSelf = resp.q2_2_14 || [];
    const hardCeo = items.filter(x => x.ceoAvg != null && x.ceoAvg < 2).map(x => x.label); // 대표가 "아니다" 쪽으로 본 항목
    if (hardCeo.length) hardOverlap = { self: hardSelf, ceo: hardCeo, common: hardSelf.filter(x => hardCeo.includes(x)) };
  }
  return { rows, items, cnt, score, n, big, strengthOverlap, weakOverlap, hardOverlap };
}

const RealAPI = {
  async call(method, params, body) {
    let lastErr;
    for (let i = 0; i < 3; i++) {
      try {
        const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 25000);
        const url = CONFIG.API_URL + (method === 'GET' ? '?' + new URLSearchParams(params).toString() : '');
        const r = await fetch(url, method === 'GET' ? { signal: ctl.signal, redirect: 'follow' } : { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctl.signal, redirect: 'follow' });
        clearTimeout(t);
        const txt = await r.text();
        let j; try { j = JSON.parse(txt); } catch (e) { throw Object.assign(new Error('서버 응답 오류 — Apps Script 배포 설정(실행: 나 / 액세스: 모든 사용자)을 확인하세요'), { transient: true }); }
        if (!j.ok) throw new Error(j.error || '요청 실패');
        return j;
      } catch (e) {
        lastErr = e;
        if (e.name === 'AbortError' || e.transient || /fetch/i.test(String(e.message))) { await new Promise(r => setTimeout(r, 1500 * (i + 1))); continue; }
        throw e;
      }
    }
    throw lastErr;
  },
  get(params) { return this.call('GET', params); },
  post(body) { return this.call('POST', null, body); }
};

function requiredProgress(def) {

}

function renderItem(it) {

  }

function rerenderItem(id) {

async function gateGo() {

function viewAnswers(sel, kind) {

      if (it.type === 'acts') return `<div class="ans">${head}${it.acts.map((x, k) => { const sc = actNum(x, a[x.id]); return `<div class="v" style="margin:4px 0 0 2px"><span class="an">${k + 1}</span> <span class="muted">${esc(x.q)}</span> <b class="${sc === 3 ? 'ok-t' : sc === 1 ? 'bad-t' : ''}">${esc(a[x.id] || '—')}</b></div>`; }).join('')}</div>`;

async function ceoSave() {

  if (!data) { if (!S.ceo.err) refreshCeo(true); return top + viewLoading(); }

  } else if (t === 'settings') {
    const cfg = data.config || {}; const open = cfg.openSurveys || [];
    body = `<div class="card"><h3>열려 있는 설문</h3><p class="small muted">체크된 설문만 리더가 응답할 수 있습니다. 마감하면 체크를 해제하세요.</p><div class="row">${SURVEY_ORDER.map(k => `<label class="chip ${open.includes(k) ? 'on' : ''}" style="cursor:pointer"><input type="checkbox" data-open="${k}" ${open.includes(k) ? 'checked' : ''} style="display:none">${SURVEYS[k].short}</label>`).join('')}</div></div>
      <div class="card"><h3>대표님 열람 범위</h3><label class="row" style="cursor:pointer"><input type="checkbox" id="cfg-react" ${cfg.ceoSeesReaction ? 'checked' : ''}> 직후 설문 Part 2 교육 반응(만족도) 점수를 대표님 페이지에도 보여줌</label><p class="small muted" style="margin:6px 0 0">기본은 끔. 발표자가 대표님이라 실명 점수가 보이면 솔직한 응답이 줄어듭니다. 집계값은 아래 내보내기로 HR이 봅니다.</p></div>

  } else {

function csvDownload(name, rows) {
  const q = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

}

    const head = ['이름', '팀', '라운드', '평가일시', '블라인드', '일치도', '일치', '근접', '과대', '과소', ...MUST4.map(m => '필수 ' + m.label + ' (리더/대표)'), ...actCols.map(c => c.head), '리더 강점', '대표가 본 강점', '리더 보완점', '대표가 본 보완점', '코멘트'];
    const out = [head];
    rows.forEach(r => ['pre', 'follow'].forEach(round => { const ev = round === 'pre' ? r.evPre : r.evFollow; const resp = round === 'pre' ? r.pre : r.follow; if (!ev) return; const c = compareRound(round, resp && resp.answers, ev.ratings);
      out.push([r.name, r.team, round === 'pre' ? '사전' : '4주 후', fmtDate(ev.evaluatedAt), ev.blind ? 'Y' : 'N', c.score == null ? '' : c.score, c.cnt.match, c.cnt.near, c.cnt.over, c.cnt.under,
        ...MUST4.map(m => (resp && resp.answers['q2_1_' + m.n] || '') + ' / ' + (ev.ratings['e2_1_' + m.n] || '')),
        ...actCols.map(ac => (resp && resp.answers['q2_2_' + ac.n + '_' + ac.k] || '') + ' / ' + (ev.ratings['e2_2_' + ac.n + '_' + ac.k] || '')),
        fmtVal(resp && resp.answers.q2_3_1), fmtVal(ev.ratings.strengths), fmtVal(resp && resp.answers.q2_3_2), fmtVal(ev.ratings.weaknesses), ev.comment || '']); }));

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-set],[data-toggle],[data-act],[data-rate],[data-ratetoggle]'); if (!b) return;
  if (b.dataset.set) { const raw = b.dataset.val; const it = ownerOf(SURVEYS[S.survey], b.dataset.set); let val = raw; if (it && it.type === 'scale5' && /^[1-5]$/.test(raw)) val = Number(raw); if (S.answers[b.dataset.set] === val) val = ''; setAnswer(b.dataset.set, val); return; }
  if (b.dataset.toggle) { const id = b.dataset.toggle, v = b.dataset.val, max = Number(b.dataset.max) || 0; let arr = Array.isArray(S.answers[id]) ? S.answers[id].slice() : []; if (arr.includes(v)) arr = arr.filter(x => x !== v); else { if (max && arr.length >= max) { toast('최대 ' + max + '개까지 선택할 수 있습니다'); return; } arr.push(v); } setAnswer(id, arr); return; }
  if (b.dataset.rate) { const d = S.ceo.draft; if (!d) return; const k = b.dataset.rate; const raw = b.dataset.val; const val = /^e2_1_/.test(k) ? Number(raw) : raw; d.ratings[k] = d.ratings[k] === val ? '' : val; markDirty(d); render(); return; }
  if (b.dataset.ratetoggle) { const d = S.ceo.draft; if (!d) return; const k = b.dataset.ratetoggle, v = b.dataset.val; let arr = Array.isArray(d.ratings[k]) ? d.ratings[k].slice() : []; if (arr.includes(v)) arr = arr.filter(x => x !== v); else { if (arr.length >= 3) { toast('최대 3개'); return; } arr.push(v); } d.ratings[k] = arr; markDirty(d); render(); return; }
  const act = b.dataset.act;
  if (act === 'jump') { e.preventDefault(); const el = $(b.getAttribute('href')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (act === 'reload') { await loadState(); render(); return; }
  if (act === 'gate-go') return gateGo();
  if (act === 'back-gate') { saveDraft(); S.step = 'gate'; render(); return; }
  if (act === 'submit') return submitSurvey();
  if (act === 'edit-again') { S.step = 'form'; render(); return; }
  if (act === 'login') return login(b.dataset.kind);
  if (act === 'logout') { const n = dirtyCount(); if (n && !confirm('저장하지 않은 평가가 ' + n + '건 있습니다. 로그아웃해도 이 브라우저에는 보관되지만, HR 집계에는 저장을 눌러야 반영됩니다.\n\n그래도 로그아웃할까요?')) return; return logout(); }
  if (act === 'ceo-refresh') return refreshCeo();
  if (act === 'ceo-tab') { const tab = b.dataset.tab; if (tab === S.ceo.tab) return; return guardLeave(() => { S.ceo.tab = tab; render(); }); }
  if (act === 'ceo-open') { const name = b.dataset.name; if (S.ceo.sel === name && S.ceo.tab === 'leaders') { S.ceo.sub = 'cmp'; render(); return; } return guardLeave(() => { S.ceo.tab = 'leaders'; S.ceo.sel = name; S.ceo.sub = 'cmp'; render(); }); }
  if (act === 'ceo-close') return guardLeave(() => { S.ceo.sel = null; render(); });
  if (act === 'ceo-sub') { S.ceo.sub = b.dataset.sub; render(); return; }
  if (act === 'ceo-round') { if (b.disabled) return; const round = b.dataset.round; if (round === S.ceo.round) return; return guardLeave(() => { S.ceo.round = round; render(); }); }
  if (act === 'ceo-reveal') { const d = S.ceo.draft; if (!d) return; if (d.blind) { d.blind = false; d.revealed = true; } else d.blind = true; if (d.dirty) persistDrafts(); render(); return; }
  if (act === 'ceo-save') return ceoSave();
  if (act === 'admin-tab') { S.admin.tab = b.dataset.tab; render(); return; }
  if (act === 'admin-save') return adminSave();
  if (act === 'export') return exportCsv(b.dataset.kind);
  if (act === 'admin-pin') { if (!confirm(b.dataset.name + '님의 PIN을 초기화할까요? 다음 응답 때 새 PIN을 정하게 됩니다.')) return; try { await API.post({ action: 'admin_reset_pin', key: S.auth.key, name: b.dataset.name }); toast('PIN을 초기화했습니다'); await refreshCeo(true); } catch (err) { toast(err.message); } return; }
  if (act === 'admin-del') { const k = b.dataset.survey; if (!confirm(b.dataset.name + '님의 ' + (k === 'eval' ? '대표 평가' : SURVEYS[k].short + ' 응답') + '을 삭제할까요? 되돌릴 수 없습니다.')) return; try { await API.post({ action: 'admin_delete', key: S.auth.key, survey: k, name: b.dataset.name }); toast('삭제했습니다'); await refreshCeo(true); } catch (err) { toast(err.message); } return; }
  if (act === 'demo-reset') { if (!confirm('데모 데이터를 초기화할까요?')) return; await API.post({ action: 'demo_reset' }); location.reload(); return; }
});

  if (t.dataset && t.dataset.input) { S.answers[t.dataset.input] = t.value; delete S.errors[t.dataset.input]; const q = t.closest('.q'); if (q) q.classList.remove('err'); allItems(SURVEYS[S.survey]).filter(x => x.showIf && x.showIf.id === t.dataset.input && x.showIf.nonEmpty).forEach(x => { const was = $(`[data-q="${x.id}"]`); const vis = visible(x); if (was && (was.style.display === 'none') === vis) rerenderItem(x.id); }); clearTimeout(window._dt); window._dt = setTimeout(() => { saveDraft(); updateProgress(); }, 400); return; }
